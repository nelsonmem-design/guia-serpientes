<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4d3a">
<title>Anfibios y reptiles de Costa Rica</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="iconos/icono-192.png">
<link rel="stylesheet" href="estilos.css?v=1.3-20261026">
<link rel="stylesheet" href="tema-tecnico.css?v=1.3-20261026">
<script>
  // Tema elegido en «Apariencia» (app.js), puesto antes de dibujar la página para que no parpadee
  try { if (localStorage.getItem('guia-serpientes-tema') === 'tecnico') document.documentElement.dataset.tema = 'tecnico'; } catch (e) { /* sin almacenamiento */ }
</script>
</head>
<body>
<header class="barra" id="barra">
  <button class="btn-icono" id="btn-atras" aria-label="Atrás" hidden>
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <img class="logo" id="logo" src="logo.svg" alt="" hidden>
  <div class="barra-titulo">
    <h1 id="titulo">Anfibios y reptiles de CR</h1>
    <p id="subtitulo">Guía de identificación</p>
  </div>
  <button class="btn-icono" id="btn-buscar" aria-label="Buscar">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
  </button>
  <button class="btn-icono" id="btn-inicio" aria-label="Inicio" hidden>
    <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 9.5V20h12V9.5"/></svg>
  </button>
</header>
<main id="vista"></main>
<div id="aviso" role="status" hidden></div>
<input type="file" id="in-camara" accept="image/*" capture="environment" hidden>
<input type="file" id="in-galeria" accept="image/*" multiple hidden>
<input type="file" id="in-respaldo" accept=".json,application/json" hidden>
<script src="datos/serpientes.js?v=1.3-20261026"></script>
<script src="datos/mapa.js?v=1.3-20261026"></script>
<script src="app.js?v=1.3-20261026"></script>
</body>
</html>
